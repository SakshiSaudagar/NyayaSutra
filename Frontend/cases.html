<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cases | NyayaSutra</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<a href="javascript:history.back()" class="back-button">
    ← Back
</a>

<header class="navbar">

    <div class="logo">⚖ NyayaSutra</div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="cases.html">Cases</a>
        <a href="hearings.html">Hearings</a>
        <a href="clients.html">Clients</a>
        <a href="tasks.html">Tasks</a>
    </nav>

</header>


<main class="container">

    <div class="page-heading">

        <div>
            <h1>Cases</h1>

            <p>
                Manage all your legal cases.
            </p>
        </div>

        <a href="add-case.html"
           class="btn">
            + Add Case
        </a>

    </div>


    <div class="toolbar">

        <input
            type="text"
            id="searchInput"
            placeholder="Search case number, title or client..."
        >


        <select id="statusFilter">

            <option value="All">
                All Status
            </option>

            <option value="Pending">
                Pending
            </option>

            <option value="Active">
                Active
            </option>

            <option value="Disposed">
                Disposed
            </option>

        </select>


        <select id="priorityFilter">

            <option value="All">
                All Priority
            </option>

            <option value="High">
                High
            </option>

            <option value="Medium">
                Medium
            </option>

            <option value="Low">
                Low
            </option>

        </select>

    </div>


    <div class="panel">

        <div id="casesContainer">
            Loading cases...
        </div>

    </div>

</main>


<script src="js/cases.js"></script>

</body>
</html>
