<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Clients | NyayaSutra</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<a href="javascript:history.back()" class="back-button">
    ← Back
</a>

<header class="navbar">

    <div class="logo">⚖ NyayaSutra</div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="cases.html">Cases</a>
        <a href="hearings.html">Hearings</a>
        <a href="clients.html">Clients</a>
        <a href="tasks.html">Tasks</a>
    </nav>

</header>


<main class="container">

    <div class="page-heading">

        <div>
            <h1>Clients</h1>

            <p>
                Manage your client information.
            </p>
        </div>

        <button
            class="btn"
            onclick="showClientForm()">
            + Add Client
        </button>

    </div>


    <div
        id="clientForm"
        class="panel hidden">

        <h2>Add Client</h2>

        <form id="clientFormElement">

            <div class="form-grid">

                <div class="form-group">

                    <label>Name *</label>

                    <input
                        id="clientName"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Phone *</label>

                    <input
                        id="clientPhone"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="clientEmail"
                    >

                </div>


                <div class="form-group">

                    <label>Address</label>

                    <input
                        id="clientAddress"
                    >

                </div>

            </div>


            <div class="form-group">

                <label>Notes</label>

                <textarea
                    id="clientNotes">
                </textarea>

            </div>


            <button
                type="submit"
                class="btn">
                Save Client
            </button>

        </form>

    </div>


    <div class="panel">

        <div id="clientsContainer">
            Loading clients...
        </div>

    </div>

</main>


<script src="js/clients.js"></script>

</body>
</html>
